[general]
# 16 bars fits comfortably in 300px with 14px bar + 3px gap each
bars = 16
framerate = 60
autosens = 1
noise_reduction = 30

[input]
method = pipewire
source = auto

[output]
method = raw
data_format = ascii
# 0-1000 range per bar
ascii_max_range = 1000
# ';' separates bars (decimal 59), '\n' separates frames (decimal 10)
bar_delimiter = 59
frame_delimiter = 10
raw_target = /dev/stdout

[color]
# colors unused in raw mode but required to not error
background = '#000000'
foreground = '#d79921'

[smoothing]
integral = 77
monstercat = 0
waves = 0
noise_reduction = 30
