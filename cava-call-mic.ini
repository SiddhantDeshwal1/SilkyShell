[general]
bars = 16
framerate = 60
autosens = 1
noise_reduction = 60

[input]
method = pipewire
# Capture mic input (default source — what goes into the call)
source = auto

[output]
method = raw
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
raw_target = /dev/stdout

[color]
background = '#000000'
foreground = '#f38ba8'

[smoothing]
noise_reduction = 60
